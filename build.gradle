plugins {
    id 'fabric-loom' version '1.10.5'
}

group = 'com.vaporvee.loadsupport'
version = project.mod_version

base {
    archivesName = 'loadsupport-1.20.1-fabric-unofficial'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.shedaniel.me/' }
}

sourceSets {
    main {
        java.srcDirs = ['fabric/src/main/java', 'common/src/main/java']
        resources.srcDirs = ['fabric/src/main/resources', 'common/src/main/resources']
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modApi("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude(group: 'net.fabricmc.fabric-api')
    }

    implementation 'com.moandjiezana.toml:toml4j:0.7.2'
}

loom {
    mixin {
        defaultRefmapName = 'loadsupport.refmap.json'
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

processResources {
    def expansion = [
        version: project.version,
        mod_name: project.mod_name,
        mod_author: project.mod_author,
        mod_id: project.mod_id,
        description: project.mod_description,
        license: project.mod_license,
        minecraft_version: project.minecraft_version,
        fabric_loader_version: project.fabric_loader_version,
        java_version: project.java_version
    ]
    inputs.properties(expansion)
    filesMatching(['fabric.mod.json', '*.mixins.json', 'pack.mcmeta']) {
        expand(expansion)
    }
}

jar {
    from('LICENSE') {
        rename { "LICENSE_${project.mod_name}" }
    }
    manifest {
        attributes(
            'Specification-Title': project.mod_name,
            'Specification-Vendor': project.mod_author,
            'Specification-Version': project.version,
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': project.mod_author,
            'Built-On-Minecraft': project.minecraft_version
        )
    }
}
